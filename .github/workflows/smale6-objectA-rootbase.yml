name: Smale6 ObjectA root-sheet base

on:
  pull_request:
    branches: [main]
    paths:
      - 'smale6/objectA_rootbase_grobcov.sing'
      - '.github/workflows/smale6-objectA-rootbase.yml'

permissions:
  contents: read

jobs:
  rootbase-cover:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y singular
          Singular --version | tee singular-version.txt
      - name: Run base dimension cover
        shell: bash
        run: |
          set +e
          /usr/bin/time -v timeout 160m Singular -q smale6/objectA_rootbase_grobcov.sing > rootbase.log 2> rootbase.time
          status=$?
          echo "$status" | tee rootbase.status
          tail -n 400 rootbase.log || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objectA-rootbase
          path: |
            singular-version.txt
            rootbase.log
            rootbase.time
            rootbase.status
            smale6/objectA_rootbase_grobcov.sing
          retention-days: 7
